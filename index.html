<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>緊張構造チャート</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="緊張構造チャート">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;
  --card:#FFFFFF;
  --ink:#000000;         /* RFC ink black */
  --muted:#767470;
  --line:#E4E4E1;
  --vision:#000000;      /* 望む成果 = インクブラック */
  --vision-soft:#F2F2F1;
  --reality:#5E6763;     /* 今のリアリティ = セージグレー系 */
  --reality-soft:#DCE1E1;/* RFC パネル色 */
  --action:#9A2827;      /* FBS 赤 = 行動の色 */
  --arrow:#CFD7D5;       /* テンションの矢印（セージ淡色）*/
  --danger:#9A2827;
  font-size:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans JP',sans-serif;
  line-height:1.7;
  padding:32px 20px 80px;
}
.wrap{max-width:760px;margin:0 auto}

/* ---------- header ---------- */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.brand-logo{height:26px;width:auto;display:block;margin-bottom:8px}
h1{font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:.08em}
.file-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{
  font-family:inherit;font-size:.8rem;letter-spacing:.04em;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:6px 16px;border-radius:0;cursor:pointer;transition:border-color .15s;
}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--vision);outline-offset:2px}

/* ---------- breadcrumb (telescoping path) ---------- */
nav.crumbs{
  display:flex;align-items:center;flex-wrap:wrap;gap:4px;
  margin:18px 0 34px;font-size:.85rem;color:var(--muted);
}
nav.crumbs button{
  font-family:inherit;font-size:inherit;background:none;border:none;cursor:pointer;
  color:var(--vision);padding:2px 4px;border-radius:4px;max-width:220px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
nav.crumbs button:hover{text-decoration:underline}
nav.crumbs .sep{color:var(--line);user-select:none}
nav.crumbs .here{color:var(--ink);font-weight:500;padding:2px 4px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- chart body & tension line ---------- */
.chart{position:relative}

.pole{
  position:relative;z-index:1;background:var(--card);
  border:1px solid var(--line);border-radius:0;padding:22px 26px 18px;
}
.pole.vision{border-top:3px solid var(--vision)}
.pole.reality{background:var(--reality-soft);border-color:var(--reality-soft);border-bottom:3px solid var(--reality)}
.pole-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.pole-label{
  font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.18em;
}
.vision .pole-label{color:var(--vision)}
.reality .pole-label{color:var(--reality)}
.date-field{display:flex;align-items:baseline;gap:6px;font-size:.8rem;color:var(--muted)}
.date-field input[type="date"]{
  font-family:inherit;font-size:.85rem;color:var(--ink);
  border:none;border-bottom:1px solid var(--line);background:none;padding:2px 0;
}
.date-field input[type="date"]:focus{outline:none;border-bottom-color:var(--vision)}

/* bullet list */
ul.items{list-style:none;margin-top:8px}
ul.items li{display:flex;align-items:flex-start;gap:10px;padding:3px 0}
ul.items li::before{content:"・";color:var(--muted);line-height:1.7;flex:none}
ul.items li[data-lv="1"]{padding-left:1.3em}
ul.items li[data-lv="1"]::before{content:"−"}
ul.items li[data-lv="2"]{padding-left:2.6em}
ul.items li[data-lv="2"]::before{content:"・";opacity:.55}
ul.items textarea{
  flex:1;font-family:inherit;font-size:.95rem;line-height:1.7;color:var(--ink);
  border:none;background:none;resize:none;overflow:hidden;padding:0;
}
ul.items textarea:focus{outline:none}
ul.items li .x,ul.items li .lv{visibility:hidden}
ul.items li:hover .x,ul.items li:focus-within .x,
ul.items li:hover .lv,ul.items li:focus-within .lv{visibility:visible}
.lv{flex:none;border:none;background:none;cursor:pointer;color:var(--muted);
  font-size:.8rem;line-height:1.7;padding:0 1px}
.lv:hover{color:var(--ink)}
.x{
  flex:none;border:none;background:none;cursor:pointer;color:var(--muted);
  font-size:.85rem;line-height:1.7;padding:0 2px;
}
.x:hover{color:var(--danger)}
.mv{
  flex:none;border:none;background:none;cursor:pointer;color:var(--muted);
  font-size:.75rem;line-height:1.7;padding:0 2px;
}
.mv:hover{color:var(--ink)}
.mv:disabled{opacity:.25;cursor:default}
.add-item{
  margin-top:6px;border:none;background:none;cursor:pointer;
  font-family:inherit;font-size:.8rem;color:var(--muted);padding:2px 0;
}
.add-item:hover{color:var(--vision)}

/* ---------- action steps ---------- */
.steps{position:relative;z-index:1;padding:48px 0 34px;display:flex;flex-direction:column;gap:12px}
/* 下から上へ向かう太いテンションの矢印 */
.steps::before{ /* 矢じり */
  content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);
  border-left:26px solid transparent;border-right:26px solid transparent;
  border-bottom:30px solid var(--arrow);
}
.steps::after{ /* 軸 */
  content:"";position:absolute;top:30px;bottom:0;left:50%;transform:translateX(-50%);
  width:18px;background:var(--arrow);
}
.steps-label{
  position:relative;z-index:1;align-self:center;background:var(--paper);padding:2px 14px;
  font-size:.75rem;letter-spacing:.1em;color:var(--muted);margin-bottom:4px;
}
.step{
  position:relative;z-index:1;background:var(--card);border:1px solid var(--line);border-radius:0;
  padding:12px 16px 10px 20px;margin:0 24px;
}
.pill{
  flex:none;font-family:inherit;font-size:.68rem;letter-spacing:.1em;
  border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:1px 10px;cursor:pointer;margin-top:4px;transition:all .12s;
}
.pill:hover{border-color:var(--ink);color:var(--ink)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ov-line .pill{margin-top:0;padding:0 8px}
.step.is-done .step-row textarea{color:var(--muted);text-decoration:line-through}
.step.is-done .ov-num{color:var(--muted)}
.ov-line.is-done .ov-text,.ov-line.is-done .ov-num{color:var(--muted)}
.ov-line.is-done .ov-text{text-decoration:line-through}
.step-row{display:flex;align-items:flex-start;gap:10px}
.step-row textarea{
  flex:1;font-family:inherit;font-size:.95rem;line-height:1.6;color:var(--ink);
  border:none;background:none;resize:none;overflow:hidden;padding:2px 0;
}
.step-row textarea:focus{outline:none}
.step-meta{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px;
  font-size:.78rem;color:var(--muted);
}
.step-meta label{display:flex;align-items:baseline;gap:5px}
.step-meta input{
  font-family:inherit;font-size:.82rem;color:var(--ink);
  border:none;border-bottom:1px solid var(--line);background:none;padding:1px 0;
}
.step-meta input[type="text"]{width:9em}
.step-meta input:focus{outline:none;border-bottom-color:var(--vision)}
.step-meta select{
  font-family:inherit;font-size:.82rem;color:var(--ink);
  border:none;border-bottom:1px solid var(--line);background:none;padding:1px 0;cursor:pointer;
}
.step-meta select:focus{outline:none;border-bottom-color:var(--vision)}
.ov-filter{display:flex;justify-content:flex-end;align-items:center;gap:8px;
  font-size:.78rem;color:var(--muted);margin-bottom:12px}
.ov-filter select{font-family:inherit;font-size:.82rem;color:var(--ink);
  border:none;border-bottom:1px solid var(--line);background:none;padding:1px 0;cursor:pointer}
.ov-missing{
  display:block;font-family:inherit;font-size:.72rem;color:var(--action);
  background:none;border:none;cursor:pointer;padding:2px 0 0;text-align:left;
}
.ov-missing:hover{text-decoration:underline}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);
  display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:50}
.modal{background:var(--card);border:1px solid var(--line);padding:22px 26px;
  width:min(430px,92vw);max-height:72vh;overflow:auto}
.modal h2{font-size:.95rem;font-weight:700;letter-spacing:.12em;margin-bottom:12px}
.member-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.member-row .name{flex:1;font-size:.92rem}
.mini{font-family:inherit;font-size:.72rem;border:1px solid var(--line);background:var(--card);
  color:var(--muted);padding:2px 10px;border-radius:999px;cursor:pointer}
.mini:hover{border-color:var(--ink);color:var(--ink)}
.mini.danger:hover{border-color:var(--danger);color:var(--danger)}
.member-add{display:flex;gap:8px;margin-top:14px}
.member-add input{flex:1;font-family:inherit;font-size:.9rem;border:none;
  border-bottom:1px solid var(--line);background:none;padding:3px 0}
.member-add input:focus{outline:none;border-bottom-color:var(--ink)}
.modal-close{margin-top:16px;text-align:right}
/* ---- ステップメモ ---- */
.note-btn{
  flex:none;font-family:inherit;font-size:.68rem;letter-spacing:.08em;
  border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:1px 10px;cursor:pointer;
}
.note-btn:hover{border-color:var(--ink);color:var(--ink)}
.note-btn.has{background:var(--ink);border-color:var(--ink);color:#fff}
.note-modal{width:min(560px,94vw)}
.note-step{font-size:.8rem;color:var(--muted);margin-bottom:10px;line-height:1.5}
.note-ta{
  width:100%;min-height:140px;font-family:inherit;font-size:.9rem;line-height:1.7;
  border:1px solid var(--line);padding:10px 12px;resize:vertical;color:var(--ink);
}
.note-ta:focus{outline:none;border-color:var(--ink)}
.note-tools{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.note-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.note-thumb{position:relative;border:1px solid var(--line);aspect-ratio:4/3;overflow:hidden;background:var(--reality-soft)}
.note-thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.note-thumb .x{position:absolute;top:2px;right:4px;background:rgba(255,255,255,.85);border-radius:999px;visibility:visible;font-size:.8rem}
.note-uploading{font-size:.74rem;color:var(--muted)}
.note-view{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:80;cursor:zoom-out}
.note-view img{max-width:92vw;max-height:92vh}
.drill{
  margin-left:auto;display:inline-flex;align-items:center;gap:5px;
  font-family:inherit;font-size:.78rem;letter-spacing:.03em;
  border:1px solid var(--action);background:var(--card);color:var(--action);
  padding:3px 14px;border-radius:999px;cursor:pointer;transition:all .15s;
}
.drill:hover{background:var(--action);color:#fff}
.drill:hover .count{background:#fff;color:var(--action)}
.drill .count{
  background:var(--action);color:#fff;border-radius:999px;
  font-size:.68rem;padding:0 6px;line-height:1.5;
}
.add-step{
  position:relative;z-index:1;align-self:center;margin:2px 0 0;
  border:1px dashed var(--line);background:var(--paper);color:var(--muted);
  font-family:inherit;font-size:.82rem;padding:6px 22px;border-radius:999px;cursor:pointer;
}
.add-step:hover{color:var(--action);border-color:var(--action)}
.sort-btn{
  position:absolute;right:0;top:10px;z-index:1;
  font-family:inherit;font-size:.72rem;letter-spacing:.06em;
  border:1px solid var(--line);background:var(--paper);color:var(--muted);
  padding:2px 12px;border-radius:999px;cursor:pointer;
}
.sort-btn:hover{color:var(--ink);border-color:var(--ink)}


/* ---------- overview (whole tree) ---------- */
.overview{background:var(--card);border:1px solid var(--line);border-radius:0;padding:26px 28px}
.ov-root{font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.14em;color:var(--vision);margin-bottom:4px}
.ov-root-goal{font-size:.85rem;color:var(--muted);margin-bottom:14px}
.ov-goal{font-size:.82rem;color:var(--vision);margin:2px 0 4px}
.ov-goal .cap,.ov-reality .cap{font-weight:700;letter-spacing:.08em;margin-right:.5em}
.ov-goal ul,.ov-reality ul{list-style:none;margin:1px 0 0;display:inline}
.ov-goal li,.ov-reality li{display:block;padding-left:1.1em;text-indent:-1.1em}
.ov-goal li[data-lv="1"],.ov-reality li[data-lv="1"]{padding-left:2.2em}
.ov-goal li[data-lv="2"],.ov-reality li[data-lv="2"]{padding-left:3.3em}
.ov-goal li::before,.ov-reality li::before{content:"・"}
.ov-reality{font-size:.82rem;color:var(--reality);margin:4px 0 2px;border-top:1px dashed var(--line);padding-top:5px}
.ov-branch{margin-left:0}
.ov-branch .ov-branch{margin-left:22px;border-left:1px solid var(--line);padding-left:18px}
.ov-step{padding:5px 0}
.ov-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ov-num{
  font-family:'Montserrat','Noto Sans JP',sans-serif;font-weight:600;color:var(--vision);
  font-size:.85rem;letter-spacing:.04em;flex:none;min-width:2.2em;
}
.ov-text{
  font-size:.92rem;background:none;border:none;padding:0;cursor:pointer;
  font-family:inherit;color:var(--ink);text-align:left;line-height:1.6;
}
.ov-text:hover{color:var(--vision);text-decoration:underline}
.ov-text.untitled{color:var(--muted);font-style:normal}
.ov-meta{font-size:.72rem;color:var(--muted);flex:none}
.ov-empty{font-size:.85rem;color:var(--muted);padding:6px 0}
.btn.active{background:var(--vision);border-color:var(--vision);color:#fff}

input[type="file"]{display:none}

@media (max-width:560px){
  .step{margin:0 6px}
  .drill{margin-left:0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ================================================================
   ホワイトボードモード
   ================================================================ */
body.wb{overflow:hidden;padding:0}
body.wb .wrap{display:none}
#wb-ui{display:none}
body.wb #wb-ui{display:block}

#wb-toolbar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);
  padding:10px 18px;margin:0;
}
#wb-toolbar h1{font-size:1.02rem}
#board .card.wide{width:960px}
#board .card.wide .pole ul.items{columns:2;column-gap:36px}
#board .card.wide .pole ul.items li{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}
#board .card.wide .steps{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;align-items:start}
#board .card.wide .steps .steps-label,#board .card.wide .steps .add-step,
#board .card.wide .steps .sort-btn{grid-column:1 / -1}
.card.wb-chip{
  padding:7px 12px;font-size:.72rem;color:var(--muted);white-space:nowrap;
  opacity:.55;cursor:pointer;width:auto;
}
.card.wb-chip:hover{opacity:1;border-color:var(--ink)}
.card.wb-chip .card-num{margin-right:7px;font-size:.7rem}
.card.mini{cursor:pointer}
.card.mini:hover{border-color:var(--ink)}
.card.mini .mini-body{display:flex;flex-direction:column;gap:6px;padding:4px 2px 2px}
.mini-meta{display:flex;align-items:center;gap:14px;font-size:.74rem;color:var(--muted);flex-wrap:wrap}
.mini-bar{height:5px;background:var(--line);border-radius:999px;overflow:hidden}
.mini-bar span{display:block;height:100%;background:var(--ink)}
.mini-goal{font-size:.8rem;color:var(--ink);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .fold{
  font-family:inherit;font-size:.68rem;letter-spacing:.06em;
  border:1px solid var(--line);background:var(--paper);color:var(--muted);
  border-radius:999px;padding:1px 10px;cursor:pointer;margin-left:auto;flex:none;
}
.card .fold:hover{color:var(--ink);border-color:var(--ink)}
#wb-toolbar h1 .ver{font-size:.72rem;font-weight:500;color:var(--muted);letter-spacing:.12em;margin-left:8px}
#wb-toolbar .btn{font-size:.78rem;padding:5px 14px}
.zoomgrp{display:flex;align-items:center;border:1px solid var(--line);background:var(--card)}
.zoomgrp .btn{border:none;padding:5px 10px}
#zoom-label{font-size:.75rem;color:var(--muted);min-width:3.4em;text-align:center;
  font-family:'Montserrat','Noto Sans JP',sans-serif}

#board{
  position:fixed;inset:0;overflow:hidden;cursor:grab;
  background-color:#FAFAF8;
  background-image:radial-gradient(circle, #DDDDD8 1px, transparent 1px);
}
#board.panning{cursor:grabbing;user-select:none}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:0}

.wb-hint{
  position:fixed;left:16px;bottom:12px;z-index:20;
  font-size:.7rem;color:var(--muted);letter-spacing:.04em;
  background:rgba(255,255,255,.85);padding:4px 10px;border:1px solid var(--line);
}

/* --- チャートカード（テキストモードのスタイルを上書きして小型化） --- */
#board .card{
  position:absolute;z-index:1;width:440px;cursor:default;
  background:var(--card);border:1px solid var(--line);
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}
#board .card-head{
  display:flex;align-items:baseline;gap:10px;
  padding:10px 16px;border-bottom:1px solid var(--line);background:#FCFCFB;
}
#board .card-num{
  font-family:'Montserrat','Noto Sans JP',sans-serif;font-weight:600;
  font-size:.8rem;color:var(--action);flex:none;letter-spacing:.04em;
}
#board .card-ttl{font-weight:700;font-size:.9rem;letter-spacing:.06em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#board .card-ttl.untitled{color:var(--muted);font-weight:500}

#board .pole{border:none;padding:14px 18px 12px;position:static}
#board .pole.vision{border-top:3px solid var(--vision)}
#board .pole.reality{background:var(--reality-soft);border-bottom:3px solid var(--reality)}
#board .pole-label{font-size:.82rem}
#board .date-field{font-size:.72rem}
#board .date-field input[type="date"]{font-size:.78rem}
#board ul.items{margin-top:4px}
#board ul.items li{gap:8px;padding:2px 0}
#board ul.items textarea{font-size:.86rem;line-height:1.6}
#board .add-item{font-size:.74rem;margin-top:4px}

#board .steps{padding:10px 18px 12px;gap:8px;
  border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
#board .steps::before,#board .steps::after{display:none}
#board .steps-label{position:static;align-self:flex-start;background:none;padding:0;
  font-size:.68rem;letter-spacing:.12em;margin-bottom:0}
#board .step{margin:0;padding:8px 10px 7px 12px}
#board .step-row{gap:8px}
#board .step-row textarea{font-size:.86rem;line-height:1.55;padding:1px 0}
#board .pill{font-size:.62rem;letter-spacing:.08em;padding:1px 8px;margin-top:3px}
#board .ov-num{font-size:.78rem;min-width:2em;margin-top:3px}
#board .step-meta{gap:12px;font-size:.7rem;margin-top:5px}
#board .step-meta input,#board .step-meta select{font-size:.75rem}
#board .drill{font-size:.68rem;padding:2px 11px;gap:4px}
#board .add-step{font-size:.74rem;padding:4px 18px;background:var(--card);margin:0}
</style>
</head>
<body>
<div class="wrap">

<script>
/* ================= data ================= */
const newId = () => 'c' + Math.random().toString(36).slice(2, 10);

function newChart(parentActionId, title){
  return {
    id: newId(),
    parentActionId: parentActionId || null,   // action step this chart telescopes from
    title: title || '',
    goalDate: '',
    goalItems: [''],
    realityDate: '',
    realityItems: [''],
    actions: []                               // {id, text, due, owner}
  };
}
function newAction(){
  return { id: newId(), text: '', due: '', owner: '', done: false };
}

let db = { charts: {}, rootId: null, members: [] };
(function init(){
  const root = newChart(null, 'マスターチャート');
  db.charts[root.id] = root;
  db.rootId = root.id;
})();

let currentId = db.rootId;
let ownerFilter = '';

/* ---- members ---- */
function ensureMembers(){
  if(!db.members) db.members = [];
  const seen = new Set(db.members);
  Object.values(db.charts).forEach(c => c.actions.forEach(a => {
    (a.owner || '').split(/[,、]/).map(x => x.trim()).filter(Boolean).forEach(n => {
      if(!seen.has(n)){ seen.add(n); db.members.push(n); }
    });
  }));
}

/* ---- relations ---- */
const chartOf = id => db.charts[id];
const subchartOfAction = actionId =>
  Object.values(db.charts).find(c => c.parentActionId === actionId) || null;
const parentChartOf = chart => {
  if(!chart.parentActionId) return null;
  return Object.values(db.charts).find(c => c.actions.some(a => a.id === chart.parentActionId)) || null;
};
function deleteChartCascade(chart){
  chart.actions.forEach(a => {
    const sub = subchartOfAction(a.id);
    if(sub) deleteChartCascade(sub);
  });
  delete db.charts[chart.id];
}
function kidsOf(chart){
  return chart.actions.map(a => subchartOfAction(a.id)).filter(Boolean);
}

/* ================= render ================= */
const $chart  = document.getElementById('chart');
const $crumbs = document.getElementById('crumbs');
const $btnView = document.getElementById('btn-view');
/* ---- member management (rename/delete propagate to all steps) ---- */
function ownerTokens(str){ return (str || '').split(/[,、]/).map(x => x.trim()).filter(Boolean); }
function eachAction(fn){ Object.values(db.charts).forEach(c => c.actions.forEach(fn)); }
function renameMember(oldName, newName){
  db.members = db.members.map(m => m === oldName ? newName : m);
  eachAction(a => {
    const t = ownerTokens(a.owner);
    if(t.includes(oldName)) a.owner = t.map(x => x === oldName ? newName : x).join('、');
  });
}
function removeMember(name){
  db.members = db.members.filter(m => m !== name);
  eachAction(a => {
    const t = ownerTokens(a.owner);
    if(t.includes(name)) a.owner = t.filter(x => x !== name).join('、');
  });
  if(ownerFilter === name) ownerFilter = '';
}
function memberUsage(name){
  let n = 0;
  eachAction(a => { if(ownerTokens(a.owner).includes(name)) n++; });
  return n;
}
const NOTE_BUCKET = 'chart-notes';

function openStepNote(action){
  if(!action.note) action.note = { text: '', images: [] };
  const note = action.note;

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const close = () => { bg.remove(); render(); };
  bg.addEventListener('click', e => { if(e.target === bg) close(); });

  const box = document.createElement('div');
  box.className = 'modal note-modal';

  const h = document.createElement('h2');
  h.textContent = 'メモ';
  box.appendChild(h);
  const stepLine = document.createElement('div');
  stepLine.className = 'note-step';
  stepLine.textContent = action.text.trim() || '（無題のステップ）';
  box.appendChild(stepLine);

  const ta = document.createElement('textarea');
  ta.className = 'note-ta';
  ta.placeholder = 'ミーティングの決定事項、気づき、宿題など';
  ta.value = note.text || '';
  ta.addEventListener('input', () => { note.text = ta.value; });
  box.appendChild(ta);

  const tools = document.createElement('div');
  tools.className = 'note-tools';
  const bDate = document.createElement('button');
  bDate.className = 'mini';
  bDate.textContent = '＋ 今日の日付';
  bDate.addEventListener('click', () => {
    const d = new Date();
    const stamp = `\n── ${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ──\n`;
    ta.value = (ta.value ? ta.value.replace(/\s*$/, '\n') : '') + stamp.replace(/^\n/, ta.value ? '' : '');
    note.text = ta.value;
    ta.focus();
  });
  const bPhoto = document.createElement('button');
  bPhoto.className = 'mini';
  bPhoto.textContent = '＋ 写真';
  const fileInp = document.createElement('input');
  fileInp.type = 'file'; fileInp.accept = 'image/*'; fileInp.multiple = true;
  fileInp.style.display = 'none';
  bPhoto.addEventListener('click', () => fileInp.click());
  const upStatus = document.createElement('span');
  upStatus.className = 'note-uploading';
  fileInp.addEventListener('change', async () => {
    const files = [...fileInp.files];
    fileInp.value = '';
    for(const f of files){
      upStatus.textContent = 'アップロード中…';
      try{

        note.images.push(path);
        await renderThumbs();
        upStatus.textContent = '';
      }catch(err){
        upStatus.textContent = 'アップロードできませんでした（' + (err.message || err) + '）';
      }
    }
  });
  tools.appendChild(bDate); tools.appendChild(bPhoto); tools.appendChild(upStatus);
  tools.appendChild(fileInp);
  box.appendChild(tools);

  const thumbs = document.createElement('div');
  thumbs.className = 'note-thumbs';
  box.appendChild(thumbs);

  async function renderThumbs(){
    thumbs.innerHTML = '';
    for(const path of (note.images || [])){

      x.addEventListener('click', () => {

        note.images = note.images.filter(p => p !== path);
        try{ sb.storage.from(NOTE_BUCKET).remove([path]); }catch(e){}
        renderThumbs();
      });
      cell.appendChild(x);
      thumbs.appendChild(cell);
      try{
        const { data, error } = await sb.storage.from(NOTE_BUCKET).createSignedUrl(path, 3600);
        if(!error && data){
          img.src = data.signedUrl;
          img.addEventListener('click', () => {
            const v = document.createElement('div');
            v.className = 'note-view';

            v.appendChild(big);

/* 画像は縮小してからStorageへ。JSONにはパスだけを保存する */
async function uploadNoteImage(action, file){
  if(typeof sb === 'undefined') throw new Error('クラウド未接続');
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = URL.createObjectURL(file);
  });
  const MAX = 1600;
  const scale = Math.min(1, MAX / Math.max(img.width, img.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(img.width * scale);
  cv.height = Math.round(img.height * scale);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(img.src);
  const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.85));
  const path = `rfc-2026-2027/${action.id}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from(NOTE_BUCKET)
    .upload(path, blob, { contentType: 'image/jpeg' });
  if(error) throw error;
  return path;
}

/* ---- overview (whole tree, numbered 1 / 1-1 / 1-1-1) ---- */
function missingOf(chart){
  const m = [];
  if(nonEmpty(chart.goalItems).length === 0) m.push('望む成果');
  if(!chart.goalDate) m.push('達成期日');
  if(nonEmpty(chart.realityItems).length === 0) m.push('リアリティ');
  if(!chart.realityDate) m.push('時点');
  return m;
}
function missingTag(chart){
  const m = missingOf(chart);
  if(m.length === 0) return null;
  const b = document.createElement('button');
  b.className = 'ov-missing';
  b.textContent = '未記入：' + m.join('・') + ' →';
  b.title = 'このチャートを開いて記入する';
  b.addEventListener('click', () => {
    currentId = chart.id; viewMode = 'chart'; render(); window.scrollTo({top:0});
  });
  return b;
}
function subtreeMatchesOwner(a){
  if(!ownerFilter) return true;
  if((a.owner || '').includes(ownerFilter)) return true;
  const sub = subchartOfAction(a.id);
  if(sub) return sub.actions.some(subtreeMatchesOwner);
  return false;
}
function renderOverview(){

function nonEmpty(items){ return (items || []).filter(s => s && s.trim()); }
function hasContent(chart){
  return chart.actions.length > 0 ||
         nonEmpty(chart.realityItems).length > 0 || chart.realityDate;
}

/* 望む成果 / 今のリアリティ の要約行 */
function poleSummary(chart, kind){
  const isGoal = kind === 'goal';
  const items = nonEmpty(isGoal ? chart.goalItems : chart.realityItems);
  const date  = isGoal ? chart.goalDate : chart.realityDate;
  if(items.length === 0 && !date) return null;

  const div = document.createElement('div');
  div.className = isGoal ? 'ov-goal' : 'ov-reality';
  const cap = document.createElement('span');
  cap.className = 'cap';
  cap.textContent = (isGoal ? '望む成果' : '今のリアリティ') + (date ? `（${date}）` : '');
  div.appendChild(cap);
  if(items.length === 1){
    div.append(parseItem(items[0]).text);
  } else if(items.length > 1){
    const ul = document.createElement('ul');
    items.forEach(t => {
      const li = document.createElement('li');
      const pi = parseItem(t);
      li.dataset.lv = pi.lv;
      li.textContent = pi.text;
      ul.appendChild(li);
    });
    div.appendChild(ul);
  }
  return div;
}

function overviewBranch(chart, prefix){
  const branch = document.createElement('div');
  branch.className = 'ov-branch';

  if(chart.actions.length === 0 && prefix === ''){
    const e = document.createElement('div');
    e.className = 'ov-empty';
    e.textContent = 'まだアクションステップがありません';
    branch.appendChild(e);
  }

  chart.actions.forEach((a, i) => {
    const num = prefix === '' ? String(i + 1) : `${prefix}-${i + 1}`;
    if(!subtreeMatchesOwner(a)) return;
    const step = document.createElement('div');
    step.className = 'ov-step';

    const line = document.createElement('div');
    line.className = 'ov-line' + (a.done ? ' is-done' : '');

    const pill = document.createElement('button');
    pill.className = 'pill' + (a.done ? ' on' : '');
    pill.textContent = a.done ? '✓' : '完了';
    pill.title = '完了にする／戻す';
    pill.addEventListener('click', () => { a.done = !a.done; render(); });
    line.appendChild(pill);

    const numEl = document.createElement('span');
    numEl.className = 'ov-num';
    numEl.textContent = num;

    const textBtn = document.createElement('button');
    textBtn.className = 'ov-text' + (a.text.trim() ? '' : ' untitled');
    textBtn.textContent = a.text.trim() || '（無題のステップ）';
    textBtn.title = 'このステップのチャートへ移動';
    textBtn.addEventListener('click', () => {
      const sub = subchartOfAction(a.id);
      currentId = sub ? sub.id : chart.id;
      viewMode = 'chart';
      render();
      window.scrollTo({top: 0});
    });

    const meta = document.createElement('span');
    meta.className = 'ov-meta';
    const bits = [];
    if(a.due) bits.push('期日 ' + a.due);
    if(a.owner.trim()) bits.push(a.owner.trim());
    meta.textContent = bits.join('　');

    line.appendChild(numEl);
    line.appendChild(textBtn);
    if(bits.length) line.appendChild(meta);
    step.appendChild(line);

    const sub = subchartOfAction(a.id);
    if(sub && hasContent(sub)){
      step.appendChild(overviewBranch(sub, num));
    }
    branch.appendChild(step);
  });

  if(!ownerFilter){
    // このチャートの今のリアリティを枝の一番下に
    const reality = poleSummary(chart, 'reality');
    if(reality) branch.appendChild(reality);
    const miss = missingTag(chart);
    if(miss) branch.appendChild(miss);
  }

  return branch;
}

function crumbPath(){
  const path = [];
  let c = chartOf(currentId);
  while(c){
    path.unshift(c);
    c = parentChartOf(c);
  }
  return path;
}
function chartNumber(c){
  if(!c.parentActionId) return '';
  const parent = parentChartOf(c);
  if(!parent) return '';
  const idx = parent.actions.findIndex(a => a.id === c.parentActionId);
  const parentNum = chartNumber(parent);
  const n = String(idx + 1);
  return parentNum ? `${parentNum}-${n}` : n;
}
function crumbLabel(c){
  if(!c.parentActionId) return 'マスターチャート';
  const parent = parentChartOf(c);
  const act = parent && parent.actions.find(a => a.id === c.parentActionId);
  const num = chartNumber(c);
  const name = (act && act.text.trim()) || '（無題のステップ）';
  return num ? `${num}　${name}` : name;
}
function renderCrumbs(){
  $crumbs.innerHTML = '';
  const path = crumbPath();
  path.forEach((c, i) => {
    if(i > 0){
      const sep = document.createElement('span');
      sep.className = 'sep'; sep.textContent = '›';
      $crumbs.appendChild(sep);
    }
    if(i === path.length - 1){
      const here = document.createElement('span');
      here.className = 'here'; here.textContent = crumbLabel(c);
      $crumbs.appendChild(here);
    } else {
      const b = document.createElement('button');
      b.textContent = crumbLabel(c);
      b.addEventListener('click', () => { currentId = c.id; render(); });
      $crumbs.appendChild(b);
    }
  });
}

function autosize(t){
  t.style.height = 'auto';
  t.style.height = t.scrollHeight + 'px';
}

/* 行頭の全角空白でインデント段階を表す（互換のためデータは文字列のまま） */
function parseItem(raw){
  let lv = 0, t = raw || '';
  while(t.startsWith('　') && lv < 2){ t = t.slice(1); lv++; }
  return { lv, text: t };
}
function composeItem(lv, text){ return '　'.repeat(lv) + text; }

function bulletList(items, onChange){
  const ul = document.createElement('ul');
  ul.className = 'items';
  items.forEach((raw, idx) => {
    let { lv, text } = parseItem(raw);
    const li = document.createElement('li');
    li.dataset.lv = lv;
    const ta = document.createElement('textarea');
    ta.rows = 1; ta.value = text;
    ta.placeholder = '箇条書きで記入';
    const setLv = n => {
      lv = Math.max(0, Math.min(2, n));
      li.dataset.lv = lv;
      items[idx] = composeItem(lv, ta.value);
    };
    ta.addEventListener('input', () => { items[idx] = composeItem(lv, ta.value); autosize(ta); });
    ta.addEventListener('keydown', e => {
      if(e.key === 'Tab' && !e.isComposing){
        e.preventDefault();
        setLv(lv + (e.shiftKey ? -1 : 1));
        return;
      }
      if(e.key === 'Enter' && !e.isComposing){
        e.preventDefault();
        items.splice(idx + 1, 0, composeItem(lv, ''));
        onChange(idx + 1);
      }
    });
    const bOut = document.createElement('button');
    bOut.className = 'lv'; bOut.textContent = '⇤'; bOut.title = '一段上げる（Shift+Tab）';
    bOut.addEventListener('click', () => { setLv(lv - 1); ta.focus(); });
    const bIn = document.createElement('button');
    bIn.className = 'lv'; bIn.textContent = '⇥'; bIn.title = '一段下げる（Tab）';
    bIn.addEventListener('click', () => { setLv(lv + 1); ta.focus(); });
    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '×'; x.title = 'この行を削除';
    x.addEventListener('click', () => {
      items.splice(idx, 1);
      if(items.length === 0) items.push('');
      onChange();
    });
    li.appendChild(ta); li.appendChild(bOut); li.appendChild(bIn); li.appendChild(x);
    ul.appendChild(li);
    requestAnimationFrame(() => autosize(ta));
  });
  return ul;
}

function pole(kind, chart){
  const isVision = kind === 'vision';
  const div = document.createElement('div');
  div.className = 'pole ' + kind;

  const head = document.createElement('div');
  head.className = 'pole-head';
  const label = document.createElement('span');
  label.className = 'pole-label';
  label.textContent = isVision ? '望む成果' : '今のリアリティ';
  const dateWrap = document.createElement('label');
  dateWrap.className = 'date-field';
  const dateCap = document.createElement('span');
  dateCap.textContent = isVision ? '達成期日' : '時点';
  const date = document.createElement('input');
  date.type = 'date';
  date.value = isVision ? chart.goalDate : chart.realityDate;
  date.addEventListener('input', () => {
    if(isVision){
      chart.goalDate = date.value;
      // 親のアクションステップの期日と同一のものとして同期
      if(chart.parentActionId){
        const parent = parentChartOf(chart);
        const act = parent && parent.actions.find(a => a.id === chart.parentActionId);
        if(act) act.due = date.value;
      }
    } else {
      chart.realityDate = date.value;
    }
  });
  dateWrap.appendChild(dateCap); dateWrap.appendChild(date);
  head.appendChild(label); head.appendChild(dateWrap);
  div.appendChild(head);

  const items = isVision ? chart.goalItems : chart.realityItems;
  const rerenderFocus = (focusIdx) => {
    render();
    if(focusIdx != null){
      const poleEl = $chart.querySelector('.pole.' + kind);
      const tas = poleEl.querySelectorAll('ul.items textarea');
      if(tas[focusIdx]) tas[focusIdx].focus();
    }
  };
  div.appendChild(bulletList(items, rerenderFocus));

  const add = document.createElement('button');
  add.className = 'add-item';
  add.textContent = isVision ? '＋ 達成された状態を追加' : '＋ 現状を追加';
  add.addEventListener('click', () => {
    items.push('');
    rerenderFocus(items.length - 1);
  });
  div.appendChild(add);
  return div;
}

function countSteps(chart){
  return chart ? chart.actions.length : 0;
}

function stepEl(chart, action, num){
  const div = document.createElement('div');
  div.className = 'step';

  if(action.done) div.classList.add('is-done');
  const row = document.createElement('div');
  row.className = 'step-row';
  const cb = document.createElement('button');
  cb.className = 'pill' + (action.done ? ' on' : '');
  cb.textContent = action.done ? '✓ 完了' : '完了';
  cb.title = '完了にする／戻す';
  cb.addEventListener('click', () => { action.done = !action.done; render(); });
  row.appendChild(cb);
  const numEl = document.createElement('span');
  numEl.className = 'ov-num';
  numEl.textContent = num;
  row.appendChild(numEl);
  const ta = document.createElement('textarea');
  ta.rows = 1; ta.value = action.text;
  ta.placeholder = 'アクションステップを記入';
  ta.addEventListener('input', () => { action.text = ta.value; autosize(ta); });
  const idx = chart.actions.findIndex(x => x.id === action.id);
  const up = document.createElement('button');
  up.className = 'mv'; up.textContent = '↑'; up.title = '上へ';
  up.disabled = idx === 0;
  up.addEventListener('click', () => {
    chart.actions.splice(idx, 1);
    chart.actions.splice(idx - 1, 0, action);
    render();
  });
  const down = document.createElement('button');
  down.className = 'mv'; down.textContent = '↓'; down.title = '下へ';
  down.disabled = idx === chart.actions.length - 1;
  down.addEventListener('click', () => {
    chart.actions.splice(idx, 1);
    chart.actions.splice(idx + 1, 0, action);
    render();
  });
  const demote = document.createElement('button');
  demote.className = 'mv'; demote.textContent = '⇥';
  demote.title = '一つ上のステップの配下へ移動（一段下げる）';
  demote.disabled = idx === 0;
  demote.addEventListener('click', () => {
    const prev = chart.actions[idx - 1];
    let sub = subchartOfAction(prev.id);
    if(!sub){
      sub = newChart(prev.id, prev.text);
      if(prev.text.trim()) sub.goalItems = [prev.text.trim()];
      if(prev.due) sub.goalDate = prev.due;
      db.charts[sub.id] = sub;
    }
    chart.actions.splice(idx, 1);
    sub.actions.push(action);          // サブチャートはIDで繋がっているため孫ごとついていく
    render();
  });
  const promote = document.createElement('button');
  promote.className = 'mv'; promote.textContent = '⇤';
  promote.title = '一段上のチャートへ移動（親ステップのすぐ後ろに並ぶ）';
  promote.disabled = !chart.parentActionId;
  promote.addEventListener('click', () => {
    const parent = parentChartOf(chart);
    if(!parent) return;
    const pIdx = parent.actions.findIndex(a => a.id === chart.parentActionId);
    chart.actions.splice(idx, 1);
    parent.actions.splice(pIdx + 1, 0, action);
    render();
  });
  const x = document.createElement('button');
  x.className = 'x'; x.textContent = '×'; x.title = 'このステップを削除';
  x.addEventListener('click', () => {
    const sub = subchartOfAction(action.id);
    if(sub && !confirm('このステップにはサブチャートがあります。サブチャートごと削除しますか？')) return;
    if(sub) deleteChartCascade(sub);
    chart.actions = chart.actions.filter(a => a.id !== action.id);
    render();
  });
  row.appendChild(ta);
  row.appendChild(up); row.appendChild(down);
  row.appendChild(promote); row.appendChild(demote);
  row.appendChild(x);
  div.appendChild(row);

  const meta = document.createElement('div');
  meta.className = 'step-meta';

  const dueL = document.createElement('label');
  dueL.append('期日');
  const due = document.createElement('input');
  due.type = 'date'; due.value = action.due;
  due.addEventListener('input', () => {
    action.due = due.value;
    const sub = subchartOfAction(action.id);
    if(sub) sub.goalDate = due.value;   // サブチャートの達成期日と同期
  });
  dueL.appendChild(due);

  const ownL = document.createElement('label');
  ownL.append('責任者');
  const own = document.createElement('select');
  ensureMembers();
  const opts = [''].concat(db.members);
  if(action.owner && !opts.includes(action.owner)) opts.push(action.owner);
  opts.forEach(name => {
    const o = document.createElement('option');
    o.value = name; o.textContent = name || '─';
    own.appendChild(o);
  });
  const oNew = document.createElement('option');
  oNew.value = '__new__'; oNew.textContent = '＋ 追加…';
  own.appendChild(oNew);
  own.value = action.owner || '';
  own.addEventListener('change', () => {
    if(own.value === '__new__'){
      const name = (prompt('メンバー名') || '').trim();
      if(name && !db.members.includes(name)) db.members.push(name);
      action.owner = name || action.owner || '';
      render(); return;
    }
    action.owner = own.value;
  });
  ownL.appendChild(own);

  const sub = subchartOfAction(action.id);
  const drill = document.createElement('button');
  drill.className = 'drill';
  if(sub){
    drill.append('チャートを開く');
    const n = countSteps(sub);
    if(n > 0){
      const badge = document.createElement('span');
      badge.className = 'count'; badge.textContent = n;
      drill.appendChild(badge);
    }
  } else {
    drill.append('⊕ チャート化');
  }
  drill.addEventListener('click', () => {
    let target = subchartOfAction(action.id);
    if(!target){
      target = newChart(action.id, action.text);
      // 親のアクションが、サブチャートの望む成果の出発点になる
      if(action.text.trim()) target.goalItems = [action.text.trim()];
      if(action.due) target.goalDate = action.due;
      db.charts[target.id] = target;
    }
    currentId = target.id;
    render();
    window.scrollTo({top: 0});
  });

  meta.appendChild(dueL);
  meta.appendChild(ownL);
  const noteBtn = document.createElement('button');
  const hasNote = a => a.note && ((a.note.text || '').trim() || (a.note.images || []).length);
  noteBtn.className = 'note-btn' + (hasNote(action) ? ' has' : '');
  noteBtn.textContent = hasNote(action) ? '✎ メモ' : 'メモ';
  noteBtn.title = 'このステップのメモ（テキスト・写真）';
  noteBtn.addEventListener('click', () => openStepNote(action));
  meta.appendChild(noteBtn);
  meta.appendChild(drill);
  div.appendChild(meta);

  requestAnimationFrame(() => autosize(ta));
  return div;
}

function renderChart(){
  const chart = chartOf(currentId);
  if(!chart){ currentId = db.rootId; return renderChart(); }
  $chart.innerHTML = '';

  $chart.appendChild(pole('vision', chart));

  const steps = document.createElement('div');
  steps.className = 'steps';
  const sl = document.createElement('div');
  sl.className = 'steps-label'; sl.textContent = '望む成果と今のリアリティの間で、緊張が解消に向かう';
  steps.appendChild(sl);

  if(chart.actions.length > 1){
    const sortBtn = document.createElement('button');
    sortBtn.className = 'sort-btn';
    const dueKey = a => a.due || '9999-99-99';           // 期日なしは常に末尾
    const isAsc = chart.actions.every((a, i, arr) => i === 0 || dueKey(arr[i-1]) <= dueKey(a));
    sortBtn.textContent = isAsc ? '期日 ↓ 遅い順' : '期日 ↑ 早い順';
    sortBtn.title = '期日で並べ替え（もう一度押すと逆順）';
    sortBtn.addEventListener('click', () => {
      const undated = chart.actions.filter(a => !a.due);
      const dated = chart.actions.filter(a => a.due);
      dated.sort((a, b) => isAsc ? b.due.localeCompare(a.due) : a.due.localeCompare(b.due));
      chart.actions = dated.concat(undated);
      render();
    });
    steps.appendChild(sortBtn);
  }

  const prefix = chartNumber(chart);
  chart.actions.forEach((a, i) => {
    const num = prefix ? `${prefix}-${i + 1}` : String(i + 1);
    steps.appendChild(stepEl(chart, a, num));
  });


  const add = document.createElement('button');
  add.className = 'add-step';
  add.textContent = '＋ アクションステップ';
  add.addEventListener('click', () => {
    chart.actions.push(newAction());
    render();
    const tas = $chart.querySelectorAll('.step .step-row textarea');
    const last = tas[tas.length - 1];
    if(last) last.focus();
  });
  steps.appendChild(add);
  $chart.appendChild(steps);

  $chart.appendChild(pole('reality', chart));
}

function reconcileDates(){
  Object.values(db.charts).forEach(c => {
    if(!c.parentActionId) return;
    const parent = parentChartOf(c);
    const act = parent && parent.actions.find(a => a.id === c.parentActionId);
    if(!act) return;
    if(act.due && !c.goalDate) c.goalDate = act.due;
    else if(!act.due && c.goalDate) act.due = c.goalDate;
    else if(act.due !== c.goalDate) c.goalDate = act.due; // 食い違いは親側を正とする
  });
}

/* ================================================================
   ホワイトボードモード（同じ db を別ビューで表示・編集する）
   ================================================================ */
const $board  = document.getElementById('board');
const $canvas = document.getElementById('canvas');
const $edges  = document.getElementById('edges');
const $edgePaths = document.getElementById('edge-paths');
const $zoomLabel = document.getElementById('zoom-label');

const WB_GRID = 26;
let wbView = { x: 0, y: 0, k: 1 };
const WB_K_MIN = 0.12, WB_K_MAX = 2.5;

function applyView(){
  $canvas.style.transform = `translate(${wbView.x}px, ${wbView.y}px) scale(${wbView.k})`;
  $board.style.backgroundSize = `${WB_GRID * wbView.k}px ${WB_GRID * wbView.k}px`;
  $board.style.backgroundPosition = `${wbView.x}px ${wbView.y}px`;
  $zoomLabel.textContent = Math.round(wbView.k * 100) + '%';
}
function zoomAt(clientX, clientY, factor){
  const r = $board.getBoundingClientRect();
  const mx = clientX - r.left, my = clientY - r.top;
  const k2 = Math.min(WB_K_MAX, Math.max(WB_K_MIN, wbView.k * factor));
  wbView.x = mx - (mx - wbView.x) * (k2 / wbView.k);
  wbView.y = my - (my - wbView.y) * (k2 / wbView.k);
  wbView.k = k2;
  applyView();
}
$board.addEventListener('wheel', e => {
  e.preventDefault();
  if(e.ctrlKey || e.metaKey){          // ピンチ（Macトラックパッド）や ⌘+ホイール
    zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.012));
  } else {                              // 2本指スクロール＝移動
    wbView.x -= e.deltaX;
    wbView.y -= e.deltaY;
    applyView();
  }
}, { passive: false });

let wbPan = null;
$board.addEventListener('pointerdown', e => {
  if(e.target.closest('.card')) return;      // カード上はパンしない
  wbPan = { sx: e.clientX, sy: e.clientY, vx: wbView.x, vy: wbView.y };
  $board.classList.add('panning');
  $board.setPointerCapture(e.pointerId);
});
$board.addEventListener('pointermove', e => {
  if(!wbPan) return;
  wbView.x = wbPan.vx + (e.clientX - wbPan.sx);
  wbView.y = wbPan.vy + (e.clientY - wbPan.sy);
  applyView();
});
$board.addEventListener('pointerup', () => {
  wbPan = null;
  $board.classList.remove('panning');
});

document.getElementById('btn-zoom-in').addEventListener('click', () => {
  const r = $board.getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.2);
});
document.getElementById('btn-zoom-out').addEventListener('click', () => {
  const r = $board.getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.2);
});
document.getElementById('btn-100').addEventListener('click', () => {
  const r = $board.getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / wbView.k);
});
document.getElementById('btn-fit').addEventListener('click', fitView);

function contentBounds(){
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  wbPos.forEach(p => {
    x1 = Math.min(x1, p.x); y1 = Math.min(y1, p.y);
    x2 = Math.max(x2, p.x + p.w); y2 = Math.max(y2, p.y + p.h);
  });
  if(!isFinite(x1)) return null;
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}
function fitView(){
  const b = contentBounds();
  if(!b) return;
  const r = $board.getBoundingClientRect();
  const pad = 70, topbar = 58;
  const k = Math.min(WB_K_MAX, Math.max(WB_K_MIN,
    Math.min((r.width - pad * 2) / b.w, (r.height - topbar - pad * 2) / b.h, 1.4)));
  wbView.k = k;
  wbView.x = (r.width  - b.w * k) / 2 - b.x * k;
  wbView.y = topbar + (r.height - topbar - b.h * k) / 2 - b.y * k;
  applyView();
}
function centerOn(chartId){
  const p = wbPos.get(chartId);
  if(!p) return;
  const r = $board.getBoundingClientRect();
  wbView.x = r.width  / 2 - (p.x + p.w / 2) * wbView.k;
  wbView.y = r.height / 2 - (p.y + p.h / 2) * wbView.k;
  applyView();
}

/* ---- ツリー自動配置 ---- */
const CARD_W = 440, GAP_X = 150, GAP_Y = 70, WB_ORIGIN = 80;
let wbCompact = false;                // 既定は詳細表示
const wbExpanded = new Set();         // 個別に展開したカード
const wbVertical = false;             // 横ツリー固定（フォーカス連動で密度を制御）
const GAP_SIB = 60, GAP_LV = 120;
/* ---- フォーカス連動セマンティックズーム ---- */
let wbFocusId = null;
function wbLevelOf(chart){
  if(!wbFocusId) return 'det';
  if(chart.id === wbFocusId) return 'det';
  const f = chartOf(wbFocusId);
  if(!f) return 'det';
  const p = parentChartOf(f);
  if(p && chart.id === p.id) return 'med';
  if(kidsOf(f).some(k => k.id === chart.id)) return 'med';
  return 'chip';
}
function wbSetFocus(id){
  wbFocusId = id;
  renderWB(() => centerOn(id));
}
let wbPos = new Map();   // chartId -> {x, y, w, h}

const cardById = id => $canvas.querySelector(`.card[data-chart-id="${id}"]`);

function wbLayoutV(root){
  const M = new Map();  // chartId -> {subW, totalW, h}
  function measure(chart){
    const el = cardById(chart.id);
    const h = el ? el.offsetHeight : 0;
    const kids = kidsOf(chart);
    let totalW = 0;
    kids.forEach((k, i) => { totalW += measure(k); if(i > 0) totalW += GAP_SIB; });
    const subW = Math.max(CARD_W, totalW);
    M.set(chart.id, { subW, totalW, h });
    return subW;
  }
  measure(root);
  function place(chart, x, y){
    const m = M.get(chart.id);
    const el = cardById(chart.id);
    const cx = x + (m.subW - CARD_W) / 2;
    if(el){ el.style.left = cx + 'px'; el.style.top = y + 'px'; }
    wbPos.set(chart.id, { x: cx, y, w: CARD_W, h: m.h });
    let xx = x + (m.subW - m.totalW) / 2;
    const y2 = y + m.h + GAP_LV;
    kidsOf(chart).forEach(k => {
      place(k, xx, y2);
      xx += M.get(k.id).subW + GAP_SIB;
    });
  }
  place(root, WB_ORIGIN, WB_ORIGIN);
  const b = contentBounds();
  if(b){
    $edges.setAttribute('width',  b.x + b.w + 200);
    $edges.setAttribute('height', b.y + b.h + 200);
  }
}

function wbLayout(){
  wbPos.clear();
  const root = chartOf(db.rootId);
  if(!root) return;
  if(wbVertical){ wbLayoutV(root); return; }
  const M = new Map();  // chartId -> {sub, total, h, w}
  function measure(chart){
    const el = cardById(chart.id);
    const h = el ? el.offsetHeight : 0;
    const w = el ? (el.offsetWidth || CARD_W) : CARD_W;
    const kids = kidsOf(chart);
    let total = 0;
    kids.forEach((k, i) => { total += measure(k); if(i > 0) total += GAP_Y; });
    const sub = Math.max(h, total);
    M.set(chart.id, { sub, total, h, w });
    return sub;
  }
  measure(root);
  function place(chart, x, y){
    const m = M.get(chart.id);
    const el = cardById(chart.id);
    const cy = y + (m.sub - m.h) / 2;
    if(el){ el.style.left = x + 'px'; el.style.top = cy + 'px'; }
    wbPos.set(chart.id, { x, y: cy, w: m.w, h: m.h });
    let yy = y + (m.sub - m.total) / 2;
    kidsOf(chart).forEach(k => {
      place(k, x + m.w + GAP_X, yy);
      yy += M.get(k.id).sub + GAP_Y;
    });
  }
  place(root, WB_ORIGIN, WB_ORIGIN);

  const b = contentBounds();
  if(b){
    $edges.setAttribute('width',  b.x + b.w + 200);
    $edges.setAttribute('height', b.y + b.h + 200);
  }
}

/* 親のアクション行 → 子チャートの「望む成果」へ点線（テレスコーピング） */
function wbDrawEdges(){
  $edgePaths.innerHTML = '';
  Object.values(db.charts).forEach(chart => {
    if(!chart.parentActionId) return;
    const parent = parentChartOf(chart);
    if(!parent) return;
    const pp = wbPos.get(parent.id), cp = wbPos.get(chart.id);
    const pEl = cardById(parent.id), cEl = cardById(chart.id);
    if(!pp || !cp || !pEl || !cEl) return;
    const row = pEl.querySelector(`[data-action-id="${chart.parentActionId}"]`);
    const vision = cEl.querySelector('.pole.vision');
    const pr = pEl.getBoundingClientRect();
    const rr = row ? row.getBoundingClientRect() : pr;
    const cr = cEl.getBoundingClientRect();
    const vr = vision ? vision.getBoundingClientRect() : cr;
    const lvP = wbLevelOf(parent), lvC = wbLevelOf(chart);
    const near = lvP !== 'chip' || lvC !== 'chip';
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    if(wbVertical){
      const sy = pp.y + (rr.top - pr.top + rr.height / 2) / wbView.k;
      const goRight = cp.x + cp.w / 2 >= pp.x + pp.w / 2;
      const sx = goRight ? pp.x + pp.w : pp.x;
      const ex = cp.x + cp.w / 2;
      const ey = cp.y;
      const dir = goRight ? 1 : -1;
      path.setAttribute('d', `M ${sx} ${sy} C ${sx + dir * 70} ${sy}, ${ex} ${ey - 70}, ${ex} ${ey - 4}`);
    } else {
      const sy = pp.y + (rr.top - pr.top + rr.height / 2) / wbView.k;
      const sx = pp.x + pp.w;
      const ey = cp.y + (vr.top - cr.top + vr.height / 2) / wbView.k;
      const ex = cp.x;
      const dx = Math.max(40, (ex - sx) / 2);
      path.setAttribute('d', `M ${sx} ${sy} C ${sx + dx} ${sy}, ${ex - dx} ${ey}, ${ex - 4} ${ey}`);
    }
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#9A2827');
    path.setAttribute('stroke-width', near ? '1.6' : '1');
    path.setAttribute('opacity', near ? '.8' : '.25');
    path.setAttribute('stroke-dasharray', '6 5');
    path.setAttribute('marker-end', 'url(#arrw)');
    $edgePaths.appendChild(path);
  });
}

let wbLayoutQueued = false;
function wbScheduleLayout(){
  if(wbLayoutQueued) return;
  wbLayoutQueued = true;
  requestAnimationFrame(() => {
    wbLayoutQueued = false;
    wbLayout();
    wbDrawEdges();
  });
}

let wbPendingFit = true;   // 初回表示とJSON読み込み後に全体表示する

function renderWB(afterLayout){
  if(!wbFocusId || !db.charts[wbFocusId]) wbFocusId = db.rootId;
  $canvas.querySelectorAll('.card').forEach(el => el.remove());
  const root = chartOf(db.rootId);
  if(root){
    (function walk(chart){
      $canvas.appendChild(wbCardEl(chart));
      kidsOf(chart).forEach(walk);
    })(root);
  }
  requestAnimationFrame(() => {
    $canvas.querySelectorAll('textarea').forEach(autosize);
    wbLayout();
    wbDrawEdges();
    if(wbPendingFit){ wbPendingFit = false; fitView(); }
    if(afterLayout) afterLayout();
  });
}

/* フォーカスを保ったまま箇条書きを組み直す */
function wbRerenderFocusPole(chartId, kind, focusIdx){
  renderWB(() => {
    if(focusIdx == null) return;
    const card = cardById(chartId);
    if(!card) return;
    const tas = card.querySelectorAll('.pole.' + kind + ' ul.items textarea');
    if(tas[focusIdx]) tas[focusIdx].focus();
  });
}

function wbBulletList(chart, kind, items){
  const ul = document.createElement('ul');
  ul.className = 'items';
  items.forEach((raw, idx) => {
    let { lv, text } = parseItem(raw);
    const li = document.createElement('li');
    li.dataset.lv = lv;
    const ta = document.createElement('textarea');
    ta.rows = 1; ta.value = text;
    ta.placeholder = '箇条書きで記入';
    const setLv = n => {
      lv = Math.max(0, Math.min(2, n));
      li.dataset.lv = lv;
      items[idx] = composeItem(lv, ta.value);
    };
    ta.addEventListener('input', () => {
      items[idx] = composeItem(lv, ta.value);
      autosize(ta);
      wbScheduleLayout();
    });
    ta.addEventListener('keydown', e => {
      if(e.key === 'Tab' && !e.isComposing){
        e.preventDefault();
        setLv(lv + (e.shiftKey ? -1 : 1));
        return;
      }
      if(e.key === 'Enter' && !e.isComposing){
        e.preventDefault();
        items.splice(idx + 1, 0, composeItem(lv, ''));
        wbRerenderFocusPole(chart.id, kind, idx + 1);
      }
    });
    const bOut = document.createElement('button');
    bOut.className = 'lv'; bOut.textContent = '⇤'; bOut.title = '一段上げる（Shift+Tab）';
    bOut.addEventListener('click', () => { setLv(lv - 1); ta.focus(); });
    const bIn = document.createElement('button');
    bIn.className = 'lv'; bIn.textContent = '⇥'; bIn.title = '一段下げる（Tab）';
    bIn.addEventListener('click', () => { setLv(lv + 1); ta.focus(); });
    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '×'; x.title = 'この行を削除';
    x.addEventListener('click', () => {
      items.splice(idx, 1);
      if(items.length === 0) items.push('');
      wbRerenderFocusPole(chart.id, kind, null);
    });
    li.appendChild(ta); li.appendChild(bOut); li.appendChild(bIn); li.appendChild(x);
    ul.appendChild(li);
  });
  return ul;
}

function wbPole(kind, chart){
  const isVision = kind === 'vision';
  const div = document.createElement('div');
  div.className = 'pole ' + kind;

  const head = document.createElement('div');
  head.className = 'pole-head';
  const label = document.createElement('span');
  label.className = 'pole-label';
  label.textContent = isVision ? '望む成果' : '今のリアリティ';
  const dateWrap = document.createElement('label');
  dateWrap.className = 'date-field';
  const dateCap = document.createElement('span');
  dateCap.textContent = isVision ? '達成期日' : '時点';
  const date = document.createElement('input');
  date.type = 'date';
  date.value = isVision ? chart.goalDate : chart.realityDate;
  date.addEventListener('change', () => {
    if(isVision){
      chart.goalDate = date.value;
      // 親のアクションステップの期日と同期
      if(chart.parentActionId){
        const parent = parentChartOf(chart);
        const act = parent && parent.actions.find(a => a.id === chart.parentActionId);
        if(act) act.due = date.value;
      }
      renderWB();
    } else {
      chart.realityDate = date.value;
    }
  });
  dateWrap.appendChild(dateCap); dateWrap.appendChild(date);
  head.appendChild(label); head.appendChild(dateWrap);

  add.textContent = isVision ? '＋ 達成された状態を追加' : '＋ 現状を追加';
  add.addEventListener('click', () => {
    items.push('');
    wbRerenderFocusPole(chart.id, kind, items.length - 1);
  });
  div.appendChild(add);
  return div;
}

function wbStepEl(chart, action, num){
  const div = document.createElement('div');
  div.className = 'step';
  div.dataset.actionId = action.id;
  if(action.done) div.classList.add('is-done');

  const row = document.createElement('div');
  row.className = 'step-row';
  const cb = document.createElement('button');
  cb.className = 'pill' + (action.done ? ' on' : '');
  cb.textContent = action.done ? '✓' : '完了';
  cb.title = '完了にする／戻す';
  cb.addEventListener('click', () => { action.done = !action.done; renderWB(); });
  row.appendChild(cb);
  const numEl = document.createElement('span');
  numEl.className = 'ov-num';
  numEl.textContent = num;
  row.appendChild(numEl);

  const ta = document.createElement('textarea');
  ta.rows = 1; ta.value = action.text;
  ta.placeholder = 'アクションステップを記入';
  ta.addEventListener('input', () => {
    action.text = ta.value;
    autosize(ta);
    // 子チャートのタイトルにも即時反映
    const sub = subchartOfAction(action.id);
    if(sub){
      const card = cardById(sub.id);
      const ttl = card && card.querySelector('.card-ttl');
      if(ttl){
        ttl.textContent = ta.value.trim() || '（無題のステップ）';
        ttl.classList.toggle('untitled', !ta.value.trim());
      }
    }
    wbScheduleLayout();
  });
  row.appendChild(ta);

  const idx = chart.actions.findIndex(x => x.id === action.id);
  const up = document.createElement('button');
  up.className = 'mv'; up.textContent = '↑'; up.title = '上へ';
  up.disabled = idx === 0;
  up.addEventListener('click', () => {
    chart.actions.splice(idx, 1);
    chart.actions.splice(idx - 1, 0, action);
    renderWB();
  });
  const down = document.createElement('button');
  down.className = 'mv'; down.textContent = '↓'; down.title = '下へ';
  down.disabled = idx === chart.actions.length - 1;
  down.addEventListener('click', () => {
    chart.actions.splice(idx, 1);
    chart.actions.splice(idx + 1, 0, action);
    renderWB();
  });
  const x = document.createElement('button');
  x.className = 'x'; x.textContent = '×'; x.title = 'このステップを削除';
  x.addEventListener('click', () => {
    const sub = subchartOfAction(action.id);
    if(sub && !confirm('このステップにはサブチャートがあります。サブチャートごと削除しますか？')) return;
    if(sub) deleteChartCascade(sub);
    chart.actions = chart.actions.filter(a => a.id !== action.id);
    renderWB();
  });
  row.appendChild(up); row.appendChild(down); row.appendChild(x);
  div.appendChild(row);

  const meta = document.createElement('div');
  meta.className = 'step-meta';

  const dueL = document.createElement('label');
  dueL.append('期日');
  const due = document.createElement('input');
  due.type = 'date'; due.value = action.due;
  due.addEventListener('change', () => {
    action.due = due.value;
    const sub = subchartOfAction(action.id);
    if(sub){ sub.goalDate = due.value; renderWB(); }   // サブチャートの達成期日と同期
  });
  dueL.appendChild(due);

  const ownL = document.createElement('label');
  ownL.append('責任者');
  const own = document.createElement('select');
  ensureMembers();
  const opts = [''].concat(db.members);
  if(action.owner && !opts.includes(action.owner)) opts.push(action.owner);
  opts.forEach(name => {
    const o = document.createElement('option');
    o.value = name; o.textContent = name || '─';
    own.appendChild(o);
  });
  const oNew = document.createElement('option');
  oNew.value = '__new__'; oNew.textContent = '＋ 追加…';
  own.appendChild(oNew);
  own.value = action.owner || '';
  own.addEventListener('change', () => {
    if(own.value === '__new__'){
      const name = (prompt('メンバー名') || '').trim();
      if(name && !db.members.includes(name)) db.members.push(name);
      action.owner = name || action.owner || '';
      renderWB(); return;
    }
    action.owner = own.value;
  });
  ownL.appendChild(own);

  const sub = subchartOfAction(action.id);
  const drill = document.createElement('button');
  drill.className = 'drill';
  drill.textContent = sub ? '→ チャートへ' : '⊕ チャート化';
  drill.addEventListener('click', () => {
    let target = subchartOfAction(action.id);
    if(!target){
      target = newChart(action.id, action.text);
      // 親のアクションを言い換えずそのまま子チャートの頂点に降ろす
      if(action.text.trim()) target.goalItems = [action.text.trim()];
      if(action.due) target.goalDate = action.due;
      db.charts[target.id] = target;
      renderWB(() => centerOn(target.id));
    } else {
      centerOn(target.id);
    }
  });

  meta.appendChild(dueL);
  meta.appendChild(ownL);
  const noteBtn = document.createElement('button');
  const hasNote = a => a.note && ((a.note.text || '').trim() || (a.note.images || []).length);
  noteBtn.className = 'note-btn' + (hasNote(action) ? ' has' : '');
  noteBtn.textContent = hasNote(action) ? '✎ メモ' : 'メモ';
  noteBtn.title = 'このステップのメモ（テキスト・写真）';
  noteBtn.addEventListener('click', () => openStepNote(action));
  meta.appendChild(noteBtn);
  meta.appendChild(drill);
  div.appendChild(meta);
  return div;
}

function wbMiniCardEl(chart){
  const div = document.createElement('div');
  div.className = 'card mini';
  div.dataset.chartId = chart.id;

  const head = document.createElement('div');
  head.className = 'card-head';
  const num = document.createElement('span');
  num.className = 'card-num';
  num.textContent = chart.parentActionId ? chartNumber(chart) : 'M';
  const ttl = document.createElement('span');
  ttl.className = 'card-ttl';
  let name = chart.title;
  if(chart.parentActionId){
    const parent = parentChartOf(chart);
    const act = parent && parent.actions.find(a => a.id === chart.parentActionId);
    name = (act && act.text.trim()) || chart.title || '（無題のステップ）';
  } else {
    name = 'マスターチャート';
  }
  ttl.textContent = name;
  head.appendChild(num); head.appendChild(ttl);
  div.appendChild(head);

  const body = document.createElement('div');
  body.className = 'mini-body';

  const firstGoal = nonEmpty(chart.goalItems).map(x => parseItem(x).text)[0];
  if(firstGoal && firstGoal !== name){
    const g = document.createElement('div');
    g.className = 'mini-goal';
    g.textContent = firstGoal;
    body.appendChild(g);
  }

  const total = chart.actions.length;
  const done = chart.actions.filter(a => a.done).length;
  const meta = document.createElement('div');
  meta.className = 'mini-meta';
  if(chart.goalDate) meta.append('期日 ' + chart.goalDate);
  meta.append(total ? `ステップ ${done}/${total} 完了` : 'ステップなし');
  const miss = missingOf(chart);
  if(miss.length){
    const m = document.createElement('span');
    m.style.color = 'var(--action)';
    m.textContent = '未記入: ' + miss.join('・');
    meta.appendChild(m);
  }
  body.appendChild(meta);

  if(total){
    const bar = document.createElement('div');
    bar.className = 'mini-bar';
    const fill = document.createElement('span');
    fill.style.width = Math.round(done / total * 100) + '%';
    bar.appendChild(fill);
    body.appendChild(bar);
  }
  div.appendChild(body);

  div.title = 'クリックでフォーカス／ダブルクリックでテキスト編集';
  div.addEventListener('click', () => wbSetFocus(chart.id));
  div.addEventListener('dblclick', () => wbOpenText(chart.id));
  return div;
}

function wbChipEl(chart){
  const div = document.createElement('div');
  div.className = 'card wb-chip';
  div.dataset.chartId = chart.id;
  const num = document.createElement('span');
  num.className = 'card-num';
  num.textContent = chart.parentActionId ? chartNumber(chart) : 'M';
  div.appendChild(num);
  let name = 'マスターチャート';
  if(chart.parentActionId){
    const parent = parentChartOf(chart);
    const act = parent && parent.actions.find(a => a.id === chart.parentActionId);
    name = (act && act.text.trim()) || chart.title || '（無題のステップ）';
  }
  div.append(name);
  div.title = 'クリックでフォーカス';
  div.addEventListener('click', () => wbSetFocus(chart.id));
  div.addEventListener('dblclick', () => wbOpenText(chart.id));
  return div;
}

function wbOpenText(chartId){
  currentId = chartId;
  viewMode = 'chart';
  setMode('text');
}

function wbCardEl(chart){
  const lv = wbLevelOf(chart);
  if(lv === 'chip') return wbChipEl(chart);
  if(lv === 'med') return wbMiniCardEl(chart);
  const div = document.createElement('div');
  div.className = 'card' + (!chart.parentActionId ? ' wide' : '');
  div.dataset.chartId = chart.id;

  const head = document.createElement('div');
  head.className = 'card-head';
  const num = document.createElement('span');
  num.className = 'card-num';
  num.textContent = chart.parentActionId ? chartNumber(chart) : 'M';
  const ttl = document.createElement('span');
  ttl.className = 'card-ttl';
  if(wbCompact){
    setTimeout(() => {
      const h = div.querySelector('.card-head');
      if(h && !h.querySelector('.fold')){
        const f = document.createElement('button');
        f.className = 'fold'; f.textContent = 'たたむ';
        f.addEventListener('click', e => {
          e.stopPropagation();
          wbExpanded.delete(chart.id);
          renderWB();
        });
        h.appendChild(f);
      }
    });
  }
  if(chart.parentActionId){
    const parent = parentChartOf(chart);
    const act = parent && parent.actions.find(a => a.id === chart.parentActionId);
    const name = (act && act.text.trim()) || '';
    ttl.textContent = name || '（無題のステップ）';
    ttl.classList.toggle('untitled', !name);
  } else {
    ttl.textContent = 'マスターチャート';
  }
  head.appendChild(num); head.appendChild(ttl);
  div.appendChild(head);

  div.appendChild(wbPole('vision', chart));

  const steps = document.createElement('div');
  steps.className = 'steps';
  const sl = document.createElement('div');
  sl.className = 'steps-label';
  sl.textContent = '行動ステップ';
  steps.appendChild(sl);
  chart.actions.forEach((a, i) => {
    const prefix = chartNumber(chart);
    const n = prefix ? `${prefix}-${i + 1}` : String(i + 1);
    steps.appendChild(wbStepEl(chart, a, n));
  });
  const add = document.createElement('button');
  add.className = 'add-step';
  add.textContent = '＋ アクションステップ';
  add.addEventListener('click', () => {
    chart.actions.push(newAction());
    renderWB(() => {
      const card = cardById(chart.id);
      const tas = card ? card.querySelectorAll('.step .step-row textarea') : [];
      if(tas.length) tas[tas.length - 1].focus();
    });
  });
  steps.appendChild(add);
  div.appendChild(steps);

  div.appendChild(wbPole('reality', chart));
  return div;
}

/* ================= モード切り替え ================= */
let mode = 'text';   // 'text' | 'board'
function renderActive(){
  if(mode === 'board') renderWB(); else render();
}
function setMode(m){
  mode = m;
  document.body.classList.toggle('wb', m === 'board');
  if(m === 'board'){
    // テキストで見ていたチャートにフォーカスを引き継ぐ
    wbFocusId = (currentId && db.charts[currentId]) ? currentId : db.rootId;
    renderWB(() => centerOn(wbFocusId));
    return;
  }
  renderActive();
}
document.getElementById('btn-mode-board').addEventListener('click', () => setMode('board'));
document.getElementById('btn-mode-text').addEventListener('click', () => setMode('text'));

/* ================= save / load（両モード共通） ================= */
const fileInput = document.getElementById('file-input');
function saveJSON(){
  const blob = new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const d = new Date().toISOString().slice(0,10);
  a.download = `tension-chart-${d}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function loadFile(f){
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(!data.charts || !data.rootId || !data.charts[data.rootId]) throw new Error('形式が違います');
      db = data;
      currentId = db.rootId;
      reconcileDates();
      ensureMembers();
      ownerFilter = '';
      wbPendingFit = true;
      renderActive();
    }catch(err){
      alert('読み込めませんでした：緊張構造チャートのJSONファイルを選んでください');
    }
  };
  r.readAsText(f);
}
document.getElementById('btn-save').addEventListener('click', saveJSON);
document.getElementById('wb-save').addEventListener('click', saveJSON);
document.getElementById('btn-load').addEventListener('click', () => fileInput.click());
document.getElementById('wb-load').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if(f) loadFile(f);
  e.target.value = '';
});
/* ホワイトボードにJSONファイルをドロップして読み込み */
$board.addEventListener('dragover', e => e.preventDefault());
$board.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if(f && /\.json$/i.test(f.name)) loadFile(f);
});

applyView();
render();
</script>

<script>
/* ================= Supabase 同期レイヤー ================= */
const SUPABASE_URL      = 'https://kzzdsibwjvocbihfqtlv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_n2qWIOJzVfrzjYANDe4UzA_O4dLVmZ1';
const CHART_ID          = 'rfc-2026-2027';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $gate = document.getElementById('auth-gate');
const $status = document.getElementById('sync-status');
let lastSavedJson = null, lastRemoteTs = null, saving = false;

function setStatus(t, danger){
  $status.textContent = t;
  $status.style.color = danger ? 'var(--danger)' : 'var(--muted)';
}

document.getElementById('btn-login').addEventListener('click', () => {
  sb.auth.signInWithOAuth({ provider: 'google',
    options: { redirectTo: location.origin + location.pathname } });
});

let currentEmail = '';
async function refreshWhoami(){
  const { data: { session } } = await sb.auth.getSession();
  currentEmail = session?.user?.email || '';
  let el = document.getElementById('whoami');
  if(!el){
    el = document.createElement('span');
    el.id = 'whoami';
    el.style.cssText = 'font-size:.72rem;color:var(--muted);align-self:center;margin-right:8px';
    $status.parentNode.insertBefore(el, $status);
    const out = document.createElement('button');
    out.className = 'btn'; out.textContent = 'ログアウト';
    out.style.fontSize = '.72rem';
    out.addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
    $status.parentNode.insertBefore(out, $status.nextSibling);
  }
  el.textContent = currentEmail;
}

async function loadRemote(){
  await refreshWhoami();
  setStatus('読み込み中…');
  const { data: row, error } = await sb.from('tension_charts')
    .select('data, updated_at').eq('id', CHART_ID).maybeSingle();
  if(error){
    setStatus(`アクセスできません（${currentEmail} はメンバー未登録）`, true);
    document.getElementById('auth-msg').textContent = error.message;
    return;
  }
  if(row){
    db = row.data;
    currentId = db.rootId;
    reconcileDates(); ensureMembers();
    lastRemoteTs = row.updated_at;
  } else {
    await saveRemote(true);
  }
  lastSavedJson = JSON.stringify(db);
  wbPendingFit = true;
  renderActive();
  setStatus('同期済み');
}

async function saveRemote(isFirst){
  const j = JSON.stringify(db);
  saving = true;
  setStatus('保存中…');
  const { data: { session } } = await sb.auth.getSession();
  const { data: row, error } = await sb.from('tension_charts')
    .upsert({ id: CHART_ID, data: db, updated_at: new Date().toISOString(),
              updated_by: session?.user?.email || '' })
    .select('updated_at').single();
  saving = false;
  if(error){ setStatus('保存できませんでした', true); return; }
  lastSavedJson = j;
  lastRemoteTs = row.updated_at;
  const t = new Date();
  setStatus('保存済み ' + t.getHours() + ':' + String(t.getMinutes()).padStart(2,'0'));
}

setInterval(() => {
  if(saving || lastSavedJson === null) return;
  if(JSON.stringify(db) !== lastSavedJson) saveRemote();
}, 2500);

setInterval(async () => {
  if(lastRemoteTs === null || saving) return;
  if(JSON.stringify(db) !== lastSavedJson) return;
  const { data: row } = await sb.from('tension_charts')
    .select('updated_at').eq('id', CHART_ID).maybeSingle();
  if(row && row.updated_at > lastRemoteTs) loadRemote();
}, 30000);

window.addEventListener('beforeunload', () => {
  if(lastSavedJson !== null && JSON.stringify(db) !== lastSavedJson){
    navigator.sendBeacon && saveRemote();
  }
});

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ $gate.style.display = 'none'; loadRemote(); }
  else { $gate.style.display = 'flex'; }
}
sb.auth.onAuthStateChange((_e, session) => {
  if(session){ $gate.style.display = 'none'; if(lastSavedJson === null) loadRemote(); }
  else { $gate.style.display = 'flex'; }
});
boot();
</script>
